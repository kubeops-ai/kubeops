apiVersion: v1
kind: Namespace
metadata:
  name: dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image-demo
  namespace: dev
  labels:
    app: broken-image-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: broken-image-demo
  template:
    metadata:
      labels:
        app: broken-image-demo
    spec:
      containers:
        - name: nginx
          # This tag intentionally does not exist.
          image: nginx:1.27-kubeops-does-not-exist
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: broken-image-demo
  namespace: dev
  labels:
    app: broken-image-demo
spec:
  selector:
    app: broken-image-demo
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
