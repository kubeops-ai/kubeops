apiVersion: v1
kind: Namespace
metadata:
  name: demo-app

---
apiVersion: v1
kind: Secret
metadata:
  name: demo-db-secret
  namespace: demo-app
type: Opaque
stringData:
  POSTGRES_PASSWORD: demo_password

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-db
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-db
  template:
    metadata:
      labels:
        app: demo-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: demo_user
            - name: POSTGRES_DB
              value: demo_db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: database-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: database-storage
          hostPath:
            path: /var/lib/kubeops-demo-postgres
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: demo-db
  namespace: demo-app
spec:
  selector:
    app: demo-db
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: api
          image: anandreddy571/kubeops-demo-api:1.0
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://demo_user:demo_password@demo-db:5432/demo_db

---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: demo-app
spec:
  selector:
    app: demo-api
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-frontend
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-frontend
  template:
    metadata:
      labels:
        app: demo-frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: frontend
          image: anandreddy571/kubeops-demo-frontend:1.0
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: demo-frontend
  namespace: demo-app
spec:
  type: NodePort
  selector:
    app: demo-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080